# Local infrastructure:            docker compose up -d                       (postgres, seq)
# The whole product (demo data):  docker compose --profile app up -d --build --wait
#   -> http://localhost:8080, sign in as 01000000001 (OTP: docker compose logs api | grep "OTP")
#   Needs the secrets in .env first: scripts/demo-secrets.sh >> .env
name: hishab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hishab
      POSTGRES_USER: hishab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432" # localhost only, never the LAN
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hishab -d hishab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Demo # migrates and seeds the demo shop at startup
      Database__ConnectionString: Host=postgres;Database=hishab;Username=hishab;Password=${POSTGRES_PASSWORD}
      Otp__Delivery: Log # codes are written to this container's log (no SMS gateway yet)
      Otp__HashKey: ${OTP_HASH_KEY:?Run scripts/demo-secrets.sh >> .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Run scripts/demo-secrets.sh >> .env}
      DataProtection__CertificateBase64: ${DATA_PROTECTION_CERT_BASE64:?Run scripts/demo-secrets.sh >> .env}
      Demo__Seed: "true"
      Demo__Login: "true" # the "Try the demo" button on the login page (Demo environment only)
      Observability__SeqUrl: http://seq
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    profiles: [app]
    build: src/web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080" # the product: SPA + /api proxy, localhost only
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # local dev only
    ports:
      - "127.0.0.1:5341:80" # UI and ingestion
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  seq-data:
