name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/api
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      # PDF labels render with Playwright's Chromium (ADR 0008); --with-deps adds the Linux libraries.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - run: pwsh Hishab.Api/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test --no-build --configuration Release

  web:
    name: web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci
      # The client is generated from openapi.json (kept in step with the API by a .NET test);
      # a stale committed client fails here.
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/api/generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Fresh secrets for this run only: generated on the runner, never printed, gone with it.
      - name: Generate run secrets
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
          scripts/demo-secrets.sh >> .env

      # The product as a user gets it: images built from the Dockerfiles, demo data seeded,
      # health checks gate the start order (postgres -> api -> web).
      - name: Start the product
        run: docker compose --profile app up -d --build --wait --wait-timeout 420

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: e2e
        run: npm run typecheck

      - name: Run e2e
        working-directory: e2e
        run: npm test

      - name: Save the API log
        if: failure()
        run: docker compose --profile app logs --no-color > e2e/compose.log

      - name: Upload traces and logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/compose.log
          retention-days: 7

      - name: Stop the product
        if: always()
        run: docker compose --profile app down -v
