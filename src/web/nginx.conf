server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API: same origin for the browser, so the refresh cookie (Path=/api/auth) is first-party.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Vite puts a content hash in every asset name: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes (/orders/123) all serve index.html, which must never be cached stale.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
