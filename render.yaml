# Render Blueprint for the free public demo (ADR 0009, steps in docs/DEPLOY.md).
# Two services: the API (Docker, free plan: 512 MB, sleeps after 15 min idle) and the web app (static
# site, does not sleep) which forwards /api/* to the API, so the browser sees one site and the HttpOnly
# refresh cookie stays first-party. The database is Neon (free), outside Render.
# Secrets are never in this file: generated by Render (generateValue) or typed in the dashboard (sync: false).
services:
  - type: web
    name: hishab-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to Bangladesh; create the Neon project in AWS Singapore too
    dockerfilePath: ./src/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off' # deploy by hand from the dashboard: a demo should not change mid-interview
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Demo # migrates at startup; demo switches below are refused anywhere else
      - key: PORT
        value: "8080" # the image listens on 8080 (ASPNETCORE_HTTP_PORTS)
      - key: Demo__Seed
        value: "true"
      - key: Demo__Login
        value: "true" # the "Try the demo" button
      - key: Demo__ResetOnStartup
        value: "true" # every wake-up starts from clean demo data: the Neon database must hold only the demo
      - key: Otp__Delivery
        value: Log
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: ForwardedHeaders__ForwardLimit
        value: "2" # the static site's rewrite + Render's edge (check it: docs/DEPLOY.md, step 6)
      - key: Pdf__MaxConcurrentRenders
        value: "1"
      - key: Jobs__WorkerCount
        value: "1"
      # 512 MB is shared with Chromium (a separate process): cap the .NET heap and use workstation GC.
      - key: DOTNET_GCHeapHardLimit
        value: "0xC800000" # 200 MiB
      - key: DOTNET_gcServer
        value: "0"
      - key: Otp__HashKey
        generateValue: true # base64 of 256 random bits
      - key: Jwt__SigningKey
        generateValue: true
      - key: Database__ConnectionString
        sync: false # Neon, keyword format with SSL Mode=Require (docs/DEPLOY.md, step 2)
      - key: DataProtection__CertificateBase64
        sync: false # scripts/demo-secrets.sh prints one

  - type: web
    name: hishab-web
    runtime: static
    buildCommand: cd src/web && npm ci && npm run build
    staticPublishPath: ./src/web/dist
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # First match wins. Change the host to your API's URL if Render gave it a suffix (docs/DEPLOY.md, step 4).
      - type: rewrite
        source: /api/*
        destination: https://hishab-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html # SPA routes (/orders/123); real files are served before any rule
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable # Vite puts a content hash in every asset name
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
